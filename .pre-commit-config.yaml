repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: synthetic-fixture-hygiene
        name: Verify synthetic fixtures and zero internal terms
        entry: python3 evals/check_repo_hygiene.py
        language: system
        pass_filenames: false
