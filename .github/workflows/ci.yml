name: PathFinder AI CI & AgentOps Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-quality-and-security:
    name: Offline Tests, PII, HITL, Lint & IaC Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app evals server.py

      - name: Run synthetic fixture & public repo hygiene check
        run: python evals/check_repo_hygiene.py

      - name: Run offline unit, PII, guardrail, HITL & ADK plugin tests
        run: pytest -v evals/test_agent_evals.py

      - name: Validate Terraform IaC
        uses: hashicorp/setup-terraform@v3
      - run: |
          cd deployment/terraform
          terraform init -backend=false
          terraform validate

  live-adk-evals:
    name: WIF-Authenticated Live ADK Golden Evaluation Suite
    runs-on: ubuntu-latest
    needs: offline-quality-and-security
    if: ${{ vars.ENABLE_LIVE_EVALS == 'true' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install -e ".[dev]"

      - name: Run ADK Golden Evalset on Vertex AI
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: "global"
        run: adk eval app evals/college_advisor.evalset.json --config_file_path evals/test_config.json --print_detailed_results
