name: PathFinder AI CI & AgentOps Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-quality-and-security:
    name: Offline Tests, PII, HITL, Lint & IaC Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check app evals server.py

      - name: Run synthetic fixture & public repo hygiene check
        run: python evals/check_repo_hygiene.py

      - name: Run offline unit, PII, guardrail, HITL & ADK plugin tests
        run: pytest -v evals/test_agent_evals.py

      - name: Validate Terraform IaC
        uses: hashicorp/setup-terraform@v3
      - run: |
          cd deployment/terraform
          terraform init -backend=false
          terraform validate

  live-adk-evals:
    name: Credential-Gated Live ADK Golden Evaluation Suite
    runs-on: ubuntu-latest
    needs: offline-quality-and-security
    if: ${{ vars.ENABLE_LIVE_EVALS == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Run ADK Golden Evalset
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "GOOGLE_API_KEY secret not set; skipping live ADK evals."
            exit 0
          fi
          adk eval app evals/college_advisor.evalset.json --config_file_path evals/test_config.json --print_detailed_results
