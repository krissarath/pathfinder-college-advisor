[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathfinder-college-advisor"
version = "1.0.0"
description = "Multi-agent Google ADK College Application Advisor for High School Students (2027-2028 Cycle)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[db]>=1.14.0",
    "pydantic>=2.9.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-gcp-trace>=1.7.0",
    "google-cloud-dlp>=3.25.0",
    "google-cloud-secret-manager>=2.21.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-logging>=3.11.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "google-adk[eval]>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pip-audit>=2.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["evals"]
pythonpath = ["."]
